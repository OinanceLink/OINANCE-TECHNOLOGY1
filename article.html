<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="OINANCE News article"
  >

  <title>OINANCE News</title>


  <!-- MAIN WEBSITE CSS -->

  <link
    rel="stylesheet"
    href="style.css"
  >


  <!-- =========================
       ARTICLE PAGE DESIGN
  ========================== -->

  <style>

    /* =========================
       ARTICLE PAGE
    ========================== */

    .article-page {

      width: 100%;

      max-width: 1050px;

      margin: 0 auto;

      padding: 70px 28px 110px;

    }


    /* =========================
       ARTICLE HEADER
    ========================== */

    .article-header {

      width: 100%;

      max-width: 850px;

      margin: 0 auto 35px;

    }


    .article-category {

      display: inline-block;

      margin-bottom: 15px;

      color: #888888;

      font-size: 11px;

      font-weight: bold;

      letter-spacing: 3px;

      text-transform: uppercase;

    }


    .article-header h1 {

      margin: 0 0 22px;

      color: #ffffff;

      font-size: clamp(38px, 5vw, 68px);

      line-height: 1.08;

      letter-spacing: -2px;

    }


    .article-meta {

      display: flex;

      flex-wrap: wrap;

      gap: 18px;

      color: #777777;

      font-size: 13px;

    }


    /* =========================
       ARTICLE IMAGES
    ========================== */

    .article-image {

      display: block;

      width: 100%;

      max-width: 820px;

      height: 390px;

      margin: 0 auto 45px;

      object-fit: cover;

      border-radius: 14px;

      border: 1px solid #292929;

      background: #111111;

    }


    /* Additional pictures */

    .article-secondary-image {

      margin-top: 35px;

      margin-bottom: 45px;

    }


    /* =========================
       ARTICLE STORY
    ========================== */

    .article-story {

      width: 100%;

      max-width: 760px;

      margin: 0 auto;

    }


    .article-story p {

      margin: 0 0 27px;

      color: #c7c7c7;

      font-size: 20px;

      line-height: 1.9;

    }


    /* =========================
       SHARE
    ========================== */

    .article-share {

      width: 100%;

      max-width: 760px;

      margin: 45px auto 0;

    }


    .x-share-button {

      border: 1px solid #333333;

      background: #111111;

      color: #ffffff;

      padding: 13px 20px;

      border-radius: 8px;

      font-size: 14px;

      font-weight: bold;

      cursor: pointer;

    }


    .x-share-button:hover {

      background: #222222;

    }


    /* =========================
       BACK BUTTON
    ========================== */

    .article-back {

      width: 100%;

      max-width: 760px;

      margin: 50px auto 0;

      padding-top: 25px;

      border-top: 1px solid #222222;

    }


    .article-back a {

      display: inline-block;

      color: #ffffff;

      font-size: 14px;

      font-weight: bold;

    }


    .article-back a:hover {

      color: #aaaaaa;

    }


    /* =========================
       LOADING / ERROR
    ========================== */

    .article-loading,
    .article-error {

      width: 100%;

      padding: 100px 20px;

      text-align: center;

      color: #999999;

      font-size: 16px;

    }


    .article-error h1 {

      margin-bottom: 15px;

      color: #ffffff;

      font-size: 42px;

    }


    .article-error p {

      margin-bottom: 25px;

      color: #888888;

      font-size: 16px;

    }


    .article-error a {

      color: #ffffff;

      font-weight: bold;

    }


    /* =========================
       PHONE
    ========================== */

    @media (max-width: 600px) {

      .article-page {

        padding: 45px 18px 75px;

      }


      .article-header {

        margin-bottom: 28px;

      }


      .article-category {

        margin-bottom: 12px;

        font-size: 9px;

        letter-spacing: 2px;

      }


      .article-header h1 {

        margin-bottom: 18px;

        font-size: 38px;

        line-height: 1.08;

        letter-spacing: -1.5px;

      }


      .article-meta {

        gap: 9px;

        font-size: 11px;

      }


      /* PHONE ARTICLE IMAGE */

      .article-image {

        width: 100%;

        height: 220px;

        margin-bottom: 30px;

        border-radius: 12px;

      }


      .article-secondary-image {

        margin-top: 30px;

        margin-bottom: 35px;

      }


      /* ARTICLE TEXT */

      .article-story {

        width: 100%;

      }


      .article-story p {

        margin-bottom: 23px;

        font-size: 18px;

        line-height: 1.85;

      }


      .article-share {

        margin-top: 35px;

      }


      .article-back {

        margin-top: 40px;

        padding-top: 20px;

      }


      .article-back a {

        font-size: 13px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header class="site-header">

    <div class="header-inner">


      <a
        href="index.html"
        class="brand"
      >

        <img
          src="file_000000001bdc81f496a425cbbdef65a7.png"
          alt="OINANCE Logo"
          class="brand-logo"
        >


        <div class="brand-text">

          <strong>
            OINANCE
          </strong>

          <span>
            TECHNOLOGY
          </span>

        </div>

      </a>


      <a
        href="index.html#news"
        class="dashboard-button"
      >

        ← Back to News

      </a>

    </div>

  </header>



  <!-- =========================
       FULL ARTICLE
  ========================== -->

  <main class="article-page">

    <article id="articleContainer">

      <div class="article-loading">

        Loading OINANCE News...

      </div>

    </article>

  </main>



  <!-- =========================
       FOOTER
  ========================== -->

  <footer class="site-footer">

    <div class="footer-bottom">

      <p>
        © 2026 OINANCE. All rights reserved.
      </p>

      <p>
        We believe the future is built.
      </p>

    </div>

  </footer>



  <!-- =========================
       SUPABASE
  ========================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>


  <!-- =========================
       ARTICLE JAVASCRIPT
  ========================== -->

  <script src="article.js"></script>


</body>

</html>
